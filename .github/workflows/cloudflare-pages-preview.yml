name: Deploy NOVA OS preview to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: neohaven-nova-os-website/pnpm-lock.yaml
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)
      - name: Build NOVA OS and Engineering Console
        working-directory: neohaven-nova-os-website
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload preview deployment to Cloudflare Pages
        run: |
          npx --yes wrangler@latest pages deploy neohaven-nova-os-website/dist \
            --project-name nova-os \
            --branch feature-preview \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "NOVA OS preview $GITHUB_SHA"
